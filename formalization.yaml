    "name": "On the planes of Cartan's cubics and the missing seven",
    "description": "For m≥1 complex fields, add one real trilinear term per unordered triple of distinct fields to Σᵢ Re(zᵢ³). If the resulting cubic’s real gradient norm depends only on |z|, then m is 1, 4 or 13. Both larger cases occur. Up to real isometry for the trace metric, their cubics are √6 times the trace of the Jordan cube on traceless Hermitian 3×3 matrices over ℂ and the octonions, respectively.\n\nFor a finite-dimensional real Euclidean cubic W(x)=d(x,x,x) with symmetric trilinear form d, define ⟨x∘y,z⟩=d(x,y,z). Assume the eikonal law |x∘x|²=c|x|⁴ with c>0. Every orthogonal decomposition into at least two nonzero product-closed subspaces consists of four lines, four planes, thirteen planes, or nine planes and an eight-dimensional block. Each pattern occurs at c=1.\n\nFor an orthogonal decomposition of such an eikonal cubic into three or more closed planes, a triple’s share is ½tr(PQ), where P and Q project orthogonally onto the third plane and the span of products from the first two, respectively. Shares lie in [0,1]. For each pair the remaining shares sum to two. For thirteen planes at least 52 unordered triples have positive share.\n\nFor triples of pairwise unbiased orthonormal bases of ℍ³, the planes spanned by their rank-one projectors centered at I/3 have minimum share 1−1/√3. Every pairwise unbiased family has at most five bases. In the Albert algebra of Hermitian 3×3 octonionic matrices, twelve pairwise unbiased Jordan frames have a thirteenth unbiased to all, unique up to ordering its idempotents. Systems of thirteen pairwise unbiased Albert frames with exactly 52 unordered triples of positive trace share exist and form one orbit under Jordan automorphisms and relabelling of the frames and of their idempotents.\n\nCompare cubics of equal eikonal strength c, each decomposed into at least two orthogonal closed planes. Scaling mixed terms by t gives Wₜ with energy |∇Wₜ|²/(9c). On a common decomposition, energy on every three-plane sum determines t and, for t∉{0,1}, W and Wₜ up to one sign. At t=0 or t=1, another eikonal cubic of the same strength on the same plane system gives identical energy everywhere at t, and its scaled cubic lies outside {Wₜ, −Wₜ}. If both parameters are positive and differ from one, equal energies everywhere identify the planes up to permutation.\n\nThis Lean development accompanies the paper of the same title, which is published on Hexagon as 2611.01171 and is attached to the releases of this repository. The README states all thirteen compared theorems and lists further results.",
