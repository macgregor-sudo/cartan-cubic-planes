name = "cartan_cubic_planes"
version = "0.1.0"
defaultTargets = ["CartanCubicPlanes.Solution"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[require]]
name = "albert_sequential_measurements"
scope = "macgregor-sudo"
git = "https://github.com/macgregor-sudo/albert-sequential-measurements.git"
rev = "10e5ca8ce341a1cb3a812569d3081005a40007c8"

[[lean_lib]]
name = "ThirteenPlanes"
srcDir = "src"

[[lean_lib]]
name = "CartanCubicPlanes.Challenge"
srcDir = "src"
roots = ["CartanCubicPlanes.Challenge"]

[[lean_lib]]
name = "CartanCubicPlanes.Solution"
srcDir = "src"
roots = ["CartanCubicPlanes.Solution", "CartanCubicPlanes.Definitions", "AlbertCarrierBridge", "AlbertCompletionSolution", "AlbertSparseAttainmentSolution", "AlbertSparsestOrbitAdapter", "AlbertSparsestSystemSolution", "CubicPlaneDefs", "ExceptionalDefs", "PlaneComparator.Blocks", "PlaneComparator.ComplexModel", "PlaneComparator.Core", "PlaneComparator.Fields", "PlaneComparator.FourLines", "PlaneComparator.Geometry", "PlaneComparator.Models", "PlaneComparator.Realizations", "PlaneComparator.Recovery", "QuaternionicProofs", "TauCeti.Data.Fin.Basic", "TauCeti.Algebra.Octonion.Basic", "TauCeti.Algebra.AlbertAlgebra.Basic", "TauCeti.Algebra.AlbertAlgebra.Determinant"]
